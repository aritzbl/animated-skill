    #e1-bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    #e1-cartel { position: absolute; left: 0; top: 436px; width: 1080px; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: -1px; color: #fff;

  <div id="root" data-composition-id="esc1" data-width="1080" data-height="1920">

    <svg id="e1-bg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">

  <script>
    const tl = gsap.timeline({ paused: true });
    // personaje en su estado inicial (dia: 1 = todavía no se aplicó ninguna mejora). Para otro episodio: dia: N
    const p = Personaje.mount(document.getElementById("e1-host"), { width: "680px", overflow: true, pose: "parado", expr: "neutro", dia: 1 });

    // idle: respiración y parpadeos (sin pisarse con cambios de expresión)
    Personaje.breathe(tl, p, 0, 7.0, 1.6);
    Personaje.blink(tl, p, 1.4, Personaje.EXPR.neutro.lid);
    Personaje.blink(tl, p, 4.6, Personaje.EXPR.neutro.lid);

    // boca: sigue las palabras de la línea de voz "01-gancho" (Whisper). Si todavía no hay voz importada, no hace nada.
    Hab.hablaLinea(tl, p, "01-gancho", "esc1", "cerrada");

    // gesto de entrada y expresión
    Personaje.poseTo(tl, p, "saludo", 0.5, 0.3, "back.out(1.5)");
    Personaje.wave(tl, p, 0.85, 4, 0.26);
    Personaje.poseTo(tl, p, "parado", 2.3, 0.4, "sine.inOut");
    Personaje.exprTo(tl, p, "orgulloso", 2.6, 0.3, "sine.inOut");

    // cartel con rebote
    tl.fromTo("#e1-cartel", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.3);

    window.__timelines = window.__timelines || {};
    window.__timelines["esc1"] = tl;
